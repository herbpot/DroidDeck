name: STOVE store checks
on:
  push:
    branches:
      - feature/stove-store-tab-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
      - name: Unit tests and Kotlin/Android compilation
        run: ./gradlew -PskipRust=true :app:testDebugUnitTest --no-daemon --stacktrace
